plugins { id 'com.android.application' }
android {
    namespace 'id.gtfsystem.kasirpos'
    compileSdk 35
    defaultConfig {
        applicationId 'id.gtfsystem.kasirpos'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '9.0.0'
        // UBAH dengan URL HTTPS aplikasi POS di hosting.
        buildConfigField 'String', 'POS_URL', '\"https://gtfsystem.xo.je/POS/pos.php\"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.3'
}
